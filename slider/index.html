<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/main.css">
    <title>Top Sellers</title>
</head>
<body>
    
    <div class="categories-container">
        <div class="categories">
            <span class="category active">ALL</span>
            <span class="category">FOOTWEAR</span>
            <span class="category">APPAREL</span>
            <span class="category">BASKETBALL</span>
            <span class="category">SLIDES</span>
        </div>
    </div>

    <div class="slider-container">
        <h2 class="slider-title">Top Sellers</h2>
        
        <div class="slider">
            <div class="slide">
                <div class="product-card">
                    <img src="images/image-99.png" alt="Nike Air Force 1 Orche">
                    <div class="product-info">
                        <span class="brand">Nike</span>
                        <h3>Air Force 1 Orche</h3>
                        <span class="price">9,985</span>
                        <span class="sizes">Sizes:8-10</span>
                    </div>
                </div>
            </div>

            <div class="slide">
                <div class="product-card">
                    <img src="images/image-91.png" alt="Nike Air Force Panda">
                    <div class="product-info">
                        <span class="brand">Nike</span>
                        <h3>Air Force Panda</h3>
                        <span class="price">19,655</span>
                        <span class="sizes">Sizes:6-10</span>
                    </div>
                </div>
            </div>

            <div class="slide">
                <div class="product-card">
                    <img src="images/image-89.png" alt="Nike Air Force 1 '07">
                    <div class="product-info">
                        <span class="brand">Nike</span>
                        <h3>Air Force 1 '07</h3>
                        <span class="price">15,750</span>
                        <span class="sizes">Sizes:9-12</span>
                    </div>
                </div>
            </div>

            <div class="slide">
                <div class="product-card">
                    <img src="images/image-93.png" alt="New Balance 327 Munsell White">
                    <div class="product-info">
                        <span class="brand">New Balance</span>
                        <h3>327' Munsell White</h3>
                        <span class="price">11,999</span>
                        <span class="sizes">Sizes:7-11</span>
                    </div>
                </div>
            </div>
        </div>

        <button id="left-btn" aria-label="Previous slide">
            <img src="images/leftBtn.svg" alt="Previous">
        </button>
        <button id="right-btn" aria-label="Next slide">
            <img src="images/rightBtn.svg" alt="Next">
        </button>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
